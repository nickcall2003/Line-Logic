name: Refresh tennis profiles

# Builds tennis_profiles.json from Jeff Sackmann's public data on a GitHub runner,
# then commits it so Railway just reads the committed file. We CLONE the public
# repos (raw/CDN URLs 404 from here) and build from the local CSVs — no raw access.
#
# Note: actions/checkout sets a git auth header for github.com scoped to THIS repo,
# which GitHub rejects when cloning a different repo. We blank that header for the
# clone so the public, anonymous clone succeeds.

on:
  schedule:
    - cron: "0 11 * * 1"       # weekly, Monday 11:00 UTC
  workflow_dispatch:           # "Run workflow" button

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone Sackmann data (public, anonymous)
        run: |
          mkdir -p /tmp/sack
          for repo in tennis_atp tennis_wta; do
            echo "== cloning $repo =="
            git -c http."https://github.com/".extraheader= clone --depth 1 \
              "https://github.com/JeffSackmann/$repo.git" "/tmp/sack/$repo" 2>&1 | tail -4
          done
          echo "== ATP match files present =="
          ls /tmp/sack/tennis_atp 2>/dev/null | grep -E 'atp_matches_(2023|2024|2025|2026)' || echo "NONE FOUND"
          echo "== WTA match files present =="
          ls /tmp/sack/tennis_wta 2>/dev/null | grep -E 'wta_matches_(2023|2024|2025|2026)' || echo "NONE FOUND"

      - name: Build tennis_profiles.json (ATP + WTA) from local clones
        env:
          LOCAL_DATA: /tmp/sack
          PROFILE_YEARS: "4"
        run: python build_tennis_profiles.py

      - name: Commit the refreshed profiles
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tennis_profiles.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No change (or build produced nothing) — nothing to commit"
          else
            git commit -m "chore: refresh tennis_profiles.json (ATP+WTA, Sackmann)"
            git push
          fi
