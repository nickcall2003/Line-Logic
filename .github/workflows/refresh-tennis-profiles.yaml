name: Refresh tennis profiles

# Rebuilds tennis_profiles.json (per-player serve/return rates, multi-year records,
# form, first-set, titles, energy, per-tournament Court Pace Index, and the pairwise
# H2H index) from Jeff Sackmann's free CSVs — on GitHub's runners, which have open
# internet (Railway's egress is allow-listed), then commits the JSON back to the repo.
# The live site reads the committed file (or its own /data copy from the in-app
# /api/tennis/profiles/build endpoint). No key needed — Sackmann data is public.
#
# The builder uses only the Python standard library (no pandas), so there is nothing
# to install. Trigger by hand anytime: Actions tab -> this workflow -> Run workflow.

on:
  schedule:
    # Weekly, Monday 11:00 UTC — after the weekend's results are in.
    - cron: "0 11 * * 1"
  workflow_dispatch:       # the "Run workflow" button — rebuild on demand

permissions:
  contents: write          # allow the job to push the regenerated JSON

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build tennis_profiles.json (ATP + WTA)
        env:
          PROFILE_YEARS: "4"          # recent window for form + rates + CPI
        run: python build_tennis_profiles.py

      - name: Commit the refreshed profiles
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tennis_profiles.json
          if git diff --cached --quiet; then
            echo "No change in tennis_profiles.json"
          else
            git commit -m "chore: refresh tennis_profiles.json (ATP+WTA, Sackmann)"
            git push
          fi
