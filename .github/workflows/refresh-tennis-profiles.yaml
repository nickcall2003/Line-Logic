name: Refresh tennis profiles

# Builds tennis_profiles.json from Jeff Sackmann's public CSVs on a GitHub runner
# (open internet) and commits it, so Railway just reads the committed file.
# A diagnostic step first prints exactly how to reach Sackmann's data, so we can
# lock the correct URL once and for all.

on:
  schedule:
    - cron: "0 11 * * 1"       # weekly, Monday 11:00 UTC
  workflow_dispatch:           # "Run workflow" button

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Diagnose Sackmann reachability
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "---- default branch ----"
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/JeffSackmann/tennis_atp | grep -o '"default_branch": *"[^"]*"' || true
          echo "---- actual match filenames at repo root ----"
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/JeffSackmann/tennis_atp/contents" \
            | grep -o '"name": *"atp_matches[^"]*"' | head -20 || true
          echo "---- HTTP status per candidate URL (want a 200) ----"
          for u in \
            "https://raw.githubusercontent.com/JeffSackmann/tennis_atp/master/atp_matches_2024.csv" \
            "https://raw.githubusercontent.com/JeffSackmann/tennis_atp/main/atp_matches_2024.csv" \
            "https://cdn.jsdelivr.net/gh/JeffSackmann/tennis_atp@master/atp_matches_2024.csv" \
            "https://github.com/JeffSackmann/tennis_atp/raw/master/atp_matches_2024.csv" \
            "https://media.githubusercontent.com/media/JeffSackmann/tennis_atp/master/atp_matches_2024.csv" ; do
            code=$(curl -s -L -o /dev/null -w "%{http_code}" "$u")
            echo "$code  $u"
          done
          echo "---- is the file Git-LFS? (first bytes) ----"
          curl -s -L "https://raw.githubusercontent.com/JeffSackmann/tennis_atp/master/atp_matches_2024.csv" | head -c 120 || true
          echo ""

      - name: Build tennis_profiles.json (ATP + WTA)
        env:
          PROFILE_YEARS: "4"
        run: python build_tennis_profiles.py || true

      - name: Commit the refreshed profiles
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tennis_profiles.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No change (or build produced nothing) — nothing to commit"
          else
            git commit -m "chore: refresh tennis_profiles.json (ATP+WTA, Sackmann)"
            git push
          fi
