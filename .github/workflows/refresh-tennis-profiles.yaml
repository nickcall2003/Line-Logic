name: Refresh tennis profiles

# Builds tennis_profiles.json from Jeff Sackmann's public data on a GitHub runner,
# then commits it so Railway just reads the committed file.
#
# We pull the Sackmann repos with actions/checkout (NOT a manual `git clone`): on a
# hosted runner an anonymous clone of github.com gets an auth challenge and dies with
# "could not read Username ... No such device or address". actions/checkout checks out
# other PUBLIC repos using the workflow's GITHUB_TOKEN, which sidesteps that entirely.

on:
  schedule:
    - cron: "0 11 * * 1"       # weekly, Monday 11:00 UTC
  workflow_dispatch:           # "Run workflow" button

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Check out Sackmann ATP data
        uses: actions/checkout@v4
        with:
          repository: JeffSackmann/tennis_atp
          path: sackmann/tennis_atp

      - name: Check out Sackmann WTA data
        uses: actions/checkout@v4
        with:
          repository: JeffSackmann/tennis_wta
          path: sackmann/tennis_wta

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show the data that was checked out
        run: |
          echo "== ATP match files present =="
          ls sackmann/tennis_atp 2>/dev/null | grep -E 'atp_matches_(2023|2024|2025|2026)' || echo "NONE FOUND"
          echo "== WTA match files present =="
          ls sackmann/tennis_wta 2>/dev/null | grep -E 'wta_matches_(2023|2024|2025|2026)' || echo "NONE FOUND"

      - name: Build tennis_profiles.json (ATP + WTA) from checked-out data
        env:
          LOCAL_DATA: ${{ github.workspace }}/sackmann
          PROFILE_YEARS: "4"
        run: python build_tennis_profiles.py

      - name: Commit the refreshed profiles
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tennis_profiles.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No change (or build produced nothing) — nothing to commit"
          else
            git commit -m "chore: refresh tennis_profiles.json (ATP+WTA, Sackmann)"
            git push
          fi
