name: Refresh tennis profiles

# Rebuilds tennis_profiles.json weekly from the live Sackmann data archive and
# commits it, so Railway just reads the committed file.
#
# IMPORTANT networking note for this account's runners:
#   api.github.com, raw.githubusercontent.com and codeload.github.com all return a
#   stock 404 here (egress policy), which is why actions/checkout of an external repo
#   and every raw/tarball fetch failed. But plain github.com GIT protocol works — the
#   checkout of THIS repo proves it. So we `git clone` the data archive directly; no
#   API, no raw, no codeload anywhere in the path.
#
#   Source: Aneeshers/tennis-sackmann-archive — the community's live mirror of Jeff
#   Sackmann's ATP/WTA datasets (his own JeffSackmann/tennis_atp + _wta are now 404).
#   Layout there is atp/ and wta/ (original atp_matches_YYYY.csv filenames inside),
#   which we symlink to the tennis_atp/ tennis_wta/ names the builder's LOCAL_DATA wants.

on:
  schedule:
    - cron: "0 11 * * 1"       # weekly, Monday 11:00 UTC
  workflow_dispatch:           # "Run workflow" button

permissions:
  contents: write

env:
  GIT_TERMINAL_PROMPT: "0"     # never hang waiting for a credential prompt; fail fast

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone the live Sackmann archive (git protocol, anonymous)
        run: |
          rm -rf /tmp/arc
          git clone --depth 1 --branch main \
            https://github.com/Aneeshers/tennis-sackmann-archive /tmp/arc
          mkdir -p sackmann
          ln -sfn /tmp/arc/atp sackmann/tennis_atp
          ln -sfn /tmp/arc/wta sackmann/tennis_wta
          echo "== ATP match files present =="
          ls sackmann/tennis_atp 2>/dev/null | grep -E 'atp_matches_(2023|2024|2025|2026)\.csv' || echo "NONE FOUND"
          echo "== WTA match files present =="
          ls sackmann/tennis_wta 2>/dev/null | grep -E 'wta_matches_(2023|2024|2025|2026)\.csv' || echo "NONE FOUND"

      - name: Build tennis_profiles.json (ATP + WTA)
        env:
          LOCAL_DATA: ${{ github.workspace }}/sackmann
          PROFILE_YEARS: "4"
        run: python build_tennis_profiles.py

      - name: Commit the refreshed profiles
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tennis_profiles.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No change (or build produced nothing) — nothing to commit"
          else
            git commit -m "chore: refresh tennis_profiles.json (ATP+WTA, Sackmann archive)"
            git push
          fi
